<!doctype html>
<html lang="en" data-page="cases">

<meta name="twitter:title" content="What Continuity does">
<meta name="twitter:description" content="One memory across three apps, a picture bank, a memory page you can check blob by blob, and conversations you can pick back up. Real screenshots, real blob ids.">
<meta name="twitter:image" content="https://continuity-production-6084.up.railway.app/assets/og.jpg">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070A; --ink:#F2F6FA; --soft:#C3CEDB; --dim:#8695A6; --faint:#5A6674;
    --edge:rgba(255,255,255,.1); --edge-2:rgba(255,255,255,.19);
    --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.085);
    --live:#5AA9FF; --live-ghost:rgba(90,169,255,.12); --wal:#7FE3D4;
    --r:24px; --r-md:16px; --r-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1);
    --display:'Outfit',system-ui,sans-serif;
    --sans:'Inter',-apple-system,system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --auto:6500ms;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--void);color:var(--ink);font:15px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .ground,.bloom,.grain{position:fixed;inset:0;z-index:0;pointer-events:none}
  .ground{background-image:url("/assets/texture.jpg");background-size:cover;background-position:center;opacity:.9}
  .bloom{background:
    radial-gradient(1000px 560px at 80% -14%, rgba(90,169,255,.15), transparent 62%),
    radial-gradient(700px 480px at 6% 102%, rgba(120,90,255,.1), transparent 60%)}
  .grain{opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  img{display:block;max-width:100%}

  /* One screen. Nothing on this page is below the fold on a laptop: the six
     capabilities are all in view the moment it opens. */
  .wrap{position:relative;z-index:1;height:100dvh;max-width:1360px;margin:0 auto;padding:16px 24px 18px;
    display:flex;flex-direction:column;gap:14px}
  .top{flex:none;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand b{font:500 16px var(--display)}
  .brand:hover{opacity:.75}
  .tiny{font:400 10.5px var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--faint)}
  .cta{padding:10px 20px;border-radius:999px;border:0;background:#fff;color:#0A0D12;
    font:600 13px var(--sans);transition:transform .25s var(--ease)}
  .cta:hover{transform:scale(1.03)}

  .lede{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  h1{margin:0;font:200 clamp(28px,3.6vw,46px)/1.05 var(--display);letter-spacing:-.03em}
  h1 em{font-style:normal;font-weight:400;
    background:linear-gradient(96deg,#fff 20%,var(--live) 130%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .realnote{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;
    background:var(--live-ghost);border:1px solid rgba(90,169,255,.25);color:var(--live);font-size:12px}
  .realnote i{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px rgba(90,169,255,.2)}

  .board{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0}
  .view[hidden],.bento[hidden],.stage[hidden]{display:none}

  /* ── glass ── */
  .pane{position:relative;overflow:hidden;border-radius:var(--r);
    background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.045) 40%,rgba(255,255,255,.02) 72%);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.04),0 34px 70px -38px rgba(0,0,0,.9)}
  .pane::before{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-110px;border-radius:50%;
    background:radial-gradient(circle,var(--tint,#5AA9FF),transparent 68%);opacity:.26;filter:blur(8px);pointer-events:none}
  .pane::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(118deg,rgba(255,255,255,.13),transparent 26%,transparent 74%,rgba(255,255,255,.04))}
  .pane > *{position:relative;z-index:1}

  /* ── the overview: six tiles, all at once ── */
  .bento{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
  /* The pane itself never moves on hover. A blurred-glass element that is
     scaled or lifted gets re-sampled every frame, and its one-pixel highlight
     shimmers along the edge as a bright line. What moves is what is inside. */
  .tile{padding:22px 22px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;
    transition:border-color .6s var(--ease);animation:tile-in .9s var(--ease) backwards}
  .tile:nth-child(1){grid-column:span 5;animation-delay:.02s}
  .tile:nth-child(2){grid-column:span 4;animation-delay:.08s}
  .tile:nth-child(3){grid-column:span 3;animation-delay:.14s}
  .tile:nth-child(4){grid-column:span 3;animation-delay:.2s}
  .tile:nth-child(5){grid-column:span 4;animation-delay:.26s}
  .tile:nth-child(6){grid-column:span 5;animation-delay:.32s}
  @keyframes tile-in{from{opacity:0;transform:translateY(28px)}}
  .tile:hover,.tile.lit{border-color:rgba(255,255,255,.34)}
  .tile .num,.tile h2,.tile p{transition:transform .7s var(--ease),opacity .7s var(--ease)}
  .tile:hover h2,.tile.lit h2{transform:translateX(4px)}
  .tile:hover p,.tile.lit p{transform:translateX(4px);opacity:1}
  .tile::before{transition:opacity .9s var(--ease),transform 1.2s var(--ease)}
  .tile:hover::before,.tile.lit::before{opacity:.4;transform:translate(-26px,22px)}
  .tile:focus-visible{outline:2px solid var(--live);outline-offset:3px}
  .num{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tint,var(--live))}
  .tile h2{margin:9px 0 0;font:300 clamp(19px,1.7vw,25px)/1.14 var(--display);letter-spacing:-.02em;max-width:19ch}
  .tile p{margin:8px 0 0;color:var(--soft);opacity:.85;font-size:13px;line-height:1.5;max-width:30ch}
  .tile .open{margin-top:auto;display:inline-flex;align-items:center;gap:7px;font:500 12px var(--sans);color:var(--ink);padding-top:12px}
  .tile .open svg{transition:transform .6s var(--ease)}
  .tile:hover .open svg,.tile.lit .open svg{transform:translateX(6px)}
  /* The real screenshot, leaning out of the corner of its tile. Anchored by
     its top-left corner rather than sized, so a wide shot and a tall one both
     fill the same corner and run off the edge, whatever their shape. */
  .peek{position:absolute!important;z-index:0!important;left:40%;top:45%;right:-7%;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.13),0 26px 60px -22px rgba(0,0,0,.95);
    transform:rotate(-3deg) translate3d(var(--px,0px),calc(var(--py,0px) + var(--lift,0px)),0);transform-origin:top left;
    transition:transform .9s var(--ease);will-change:transform;backface-visibility:hidden;
    -webkit-mask-image:linear-gradient(155deg,#000 64%,transparent 100%);mask-image:linear-gradient(155deg,#000 64%,transparent 100%)}
  .peek.slim{left:60%;top:24%;right:5%}
  .tile:nth-child(3) .peek{left:16%;top:50%;right:-46%}
  .tile:nth-child(4) .peek.slim{left:50%;top:47%;right:5%}
  @media (max-height:800px){ .tile p{display:none} .peek{top:40%} .peek.slim{top:20%} .tile:nth-child(4) .peek.slim{top:40%} }
  .peek img{width:100%;height:auto}
  .tile:hover .peek,.tile.lit .peek{--lift:-12px}
  .tile.tracking .peek{transition:transform .25s ease-out}
  .tile .steps-mini{position:absolute!important;right:22px;bottom:22px;left:46%;display:flex;flex-direction:column;gap:8px}
  .tile .steps-mini span{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.3);font:500 12px var(--sans);color:var(--soft)}
  .tile .steps-mini span b{font:500 10px var(--mono);letter-spacing:.12em;color:var(--tint)}

  /* ── the stage: one capability, large, with the rest a click away ── */
  .stage{display:grid;grid-template-columns:262px minmax(0,1fr);gap:14px;scroll-margin-top:14px}
  .dock{position:relative;display:flex;flex-direction:column;gap:8px;min-height:0}
  /* The highlight is one element that slides to whichever tab is showing. */
  .glide{position:absolute;left:0;top:0;z-index:0;border-radius:18px;pointer-events:none;
    background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
    box-shadow:0 0 0 1px rgba(255,255,255,.24);
    transition:transform .7s var(--ease),width .7s var(--ease),height .7s var(--ease),opacity .4s var(--ease);opacity:0}
  .glide.placed{opacity:1}
  .tab{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;
    padding:10px 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.028);cursor:pointer;overflow:hidden;
    transition:border-color .5s var(--ease),background .5s var(--ease)}
  .tab:hover{border-color:var(--edge-2);background:rgba(255,255,255,.05)}
  .tab b{font:400 15px/1.2 var(--display);color:var(--dim);transition:color .5s var(--ease),transform .6s var(--ease)}
  .tab .num{color:var(--faint);transition:color .5s var(--ease)}
  .tab:hover b{transform:translateX(3px)}
  .tab.on{border-color:transparent;background:transparent}
  .tab.on b{color:#fff;transform:translateX(3px)}
  .tab.on .num{color:var(--tint)}
  /* The clock: fills along the bottom of the tab that is showing. */
  .tab .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden}
  .tab.on .bar::after{content:"";position:absolute;inset:0;background:var(--tint);transform-origin:left center;
    animation:fill var(--auto) linear both}
  .resting .tab.on .bar::after{animation:none;transform:scaleX(1);opacity:.45}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .dock-foot{flex:none;display:flex;gap:8px}
  .mini{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:999px;
    border:1px solid var(--edge);background:var(--glass);color:var(--soft);font:500 12px var(--sans);cursor:pointer;
    transition:.25s var(--ease)}
  .mini:hover{background:var(--glass-2);color:#fff;transform:scale(1.03)}
  .mini[hidden]{display:none}
  .mini .pause{display:block} .mini .go-on{display:none}
  .resting .mini .pause{display:none} .resting .mini .go-on{display:block}

  .panel{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:30px;padding:26px 30px 26px 26px;min-height:0}
  /* The screenshot is shown large and allowed to run off the right of its
     column. Fitted whole, a wide screenshot was a thumbnail with air above
     and below it; cropped, it is big enough to read. */
  .fig{min-height:0;min-width:0;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;border-radius:18px;
    -webkit-mask-image:linear-gradient(90deg,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,#000 84%,transparent 100%)}
  .frame{flex:none;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.18);
    background:#0B0F15;box-shadow:0 40px 90px -40px rgba(0,0,0,.95);display:flex;height:min(100%,560px)}
  .frame img{height:100%;width:auto;max-width:none}
  .fig.whole{justify-content:center;-webkit-mask-image:none;mask-image:none;overflow:visible}
  .fig.whole .frame{height:auto;max-height:100%;max-width:100%}
  .fig.whole .frame img{height:auto;width:auto;max-height:100%;max-width:100%}
  .duo{height:100%;width:100%;min-height:0;display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1fr);gap:14px;align-items:center}
  .duo .frame{justify-self:center;height:auto;max-height:100%}
  .duo .frame img{width:100%;height:auto;max-height:100%;object-fit:contain}
  .copy{min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding-right:4px;scrollbar-width:thin}
  .copy h2{margin:10px 0 0;font:300 clamp(24px,2.5vw,34px)/1.12 var(--display);letter-spacing:-.025em}
  .copy h2 b{font-weight:400;color:#fff}
  .copy .lead{margin:14px 0 0;color:var(--soft);font-size:14.5px;line-height:1.65}
  .how{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .how li{display:flex;gap:11px;align-items:flex-start;color:var(--soft);font-size:13px;line-height:1.5}
  .how li>span{flex:1;min-width:0}
  .how li i{flex:none;margin-top:6px;width:6px;height:6px;border-radius:50%;background:var(--tint,var(--live))}
  .how code,.truth code{font:11.5px var(--mono);background:rgba(0,0,0,.38);border:1px solid var(--edge);
    padding:1px 6px;border-radius:5px;color:var(--live)}
  .truth{margin:16px 0 0;padding:11px 14px;border-radius:var(--r-md);background:var(--live-ghost);
    border:1px solid rgba(90,169,255,.22);color:var(--soft);font-size:12.5px;line-height:1.55}
  .truth b{display:block;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--live);margin-bottom:4px}
  .go{display:flex;gap:9px;align-items:center;margin-top:20px;flex-wrap:wrap}
  .try{display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:999px;border:0;
    background:#fff;color:#0A0D12;font:600 13px var(--sans);cursor:pointer;transition:transform .25s var(--ease)}
  .try:hover{transform:scale(1.03)}
  .try svg{transition:transform .25s var(--ease)}
  .try:hover svg{transform:translateX(3px)}
  .alt{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;
    border:1px solid var(--edge-2);background:var(--glass);color:var(--soft);font:500 12.5px var(--sans);transition:.22s var(--ease)}
  .alt:hover{background:var(--glass-2);color:#fff;transform:scale(1.03)}
  .alt[hidden]{display:none}

  /* What changes when a tab does: the contents rise in, a beat apart. */
  .panel.swap .fig{animation:swap-in .6s var(--ease) both}
  .panel.swap .copy > *{animation:swap-in .6s var(--ease) both}
  .panel.swap .copy > *:nth-child(2){animation-delay:.05s}
  .panel.swap .copy > *:nth-child(3){animation-delay:.1s}
  .panel.swap .copy > *:nth-child(n+4){animation-delay:.15s}
  @keyframes swap-in{from{opacity:0;transform:translateY(16px)}}

  /* The recorded handoff, as three small app columns. */
  .handoff{height:100%;min-height:0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;scrollbar-width:thin}
  .col{flex:none;border:1px solid var(--edge);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.26)}
  .col-h{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--edge);font:500 11px var(--sans);color:var(--soft)}
  .col-h .t{margin-left:auto;font:400 10px var(--mono);color:var(--faint)}
  .msgs{padding:9px;display:flex;flex-direction:column;gap:6px}
  .m{max-width:94%;padding:6px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .m.you{align-self:flex-end;background:linear-gradient(150deg,rgba(90,169,255,.42),rgba(90,169,255,.2));border:1px solid rgba(150,200,255,.4);color:#fff}
  .m.bot{align-self:flex-start;background:var(--glass-2);border:1px solid var(--edge);color:var(--soft)}
  .m.sys{align-self:center;color:var(--faint);font:400 10px var(--mono);padding:1px 0}
  .m.sys code{color:var(--live)}
  .blobs{padding:7px 10px 9px;border-top:1px solid var(--edge);display:flex;flex-direction:column;gap:3px}
  .blob{display:flex;gap:7px;align-items:center;font:400 10px var(--mono);color:var(--dim);min-width:0}
  .blob i{width:5px;height:5px;border-radius:50%;background:var(--wal);flex:none}
  .blob em{font-style:normal;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .blob a{color:var(--live);flex:none;margin-left:auto}

  .jobs{width:100%;height:100%;min-height:0;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
  .job{position:relative;display:flex;flex-direction:column;gap:5px;padding:13px 15px 11px;border-radius:18px;min-height:0;overflow:hidden;
    border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.26);transition:border-color .5s var(--ease),background .5s var(--ease)}
  .job:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
  .job .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;
    border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
    transition:transform .6s var(--ease)}
  .job:hover .ic{transform:translateY(-3px)}
  .job .ic svg{width:17px;height:17px;fill:none;stroke:var(--jt);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .job b{font:400 15px/1.2 var(--display);color:#fff}
  .job p{margin:0;color:var(--dim);font-size:12px;line-height:1.45}
  /* On a short screen the example question earns its place over the blurb. */
  @media (max-height:820px){ .job p{display:none} .job{padding:11px 14px 10px} }
  .job .ask{margin-top:auto;padding-top:6px;color:var(--jt);font-size:11.5px;line-height:1.4;display:flex;gap:6px;align-items:baseline}
  .job .ask svg{flex:none;transition:transform .6s var(--ease);transform:translateY(2px)}
  .job:hover .ask svg{transform:translate(4px,2px)}
  .panel.swap .job{animation:swap-in .7s var(--ease) both}
  .panel.swap .job:nth-child(2){animation-delay:.06s}.panel.swap .job:nth-child(3){animation-delay:.12s}
  .panel.swap .job:nth-child(4){animation-delay:.18s}.panel.swap .job:nth-child(5){animation-delay:.24s}
  .panel.swap .job:nth-child(6){animation-delay:.3s}
  .tile .jobs-mini{position:absolute!important;right:20px;bottom:20px;left:44%;display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;
    transform:translate3d(0,var(--lift,0px),0);transition:transform .9s var(--ease)}
  .tile:hover .jobs-mini,.tile.lit .jobs-mini{--lift:-8px}
  .tile .jobs-mini span{padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.3);
    font:500 11.5px var(--sans);color:var(--soft)}

  .steps{width:100%;display:flex;flex-direction:column;gap:12px}
  .step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px;border-radius:18px;
    border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.26)}
  .step .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:500 13px var(--mono);color:var(--tint);
    border:1px solid rgba(255,255,255,.18);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03))}
  .step b{display:block;font:500 15px var(--display)}
  .step span{color:var(--dim);font-size:12.5px;line-height:1.5}
  .step .k{display:block;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tint);margin-bottom:2px}

  .foot{flex:none;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-right:64px}

  /* Same-document transitions on this page: the tile that was clicked grows
     into the stage. The page-level choreography in motion.css is for arriving
     from another page; here only the morph should move. */

    <button class="mini" id="auto" aria-label="Pause" aria-pressed="true">
      <svg class="pause" width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M4.5 2.5v9M9.5 2.5v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="go-on" width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M4 2.5l7.5 4.5L4 11.5z" fill="currentColor"/></svg>
      <span class="pause">Pause</span><span class="go-on">Play</span>
    </button>
  </div>`;

$("dock").insertAdjacentHTML("afterbegin", '<span class="glide" id="glide"></span>');
const tabs = [...document.querySelectorAll(".tab")];
function glide() {
  const t = tabs[at], g = $("glide");
  if (!t || $("stage").hidden) return;
  g.style.width = t.offsetWidth + "px"; g.style.height = t.offsetHeight + "px";
  g.style.transform = `translate(${t.offsetLeft}px,${t.offsetTop}px)`;
  g.classList.add("placed");
  // On a phone the tabs are a strip; bring the one showing into view.
  const d = $("dock");
  if (d.scrollWidth > d.clientWidth + 1) d.scrollTo({ left: t.offsetLeft - (d.clientWidth - t.offsetWidth) / 2, behavior: still ? "auto" : "smooth" });
}
addEventListener("resize", glide);
const tiles = [...document.querySelectorAll(".tile")];
let at = 0, view = "bento", bot = { tg: "walrusmemory_bot", dc: null }, handoffHtml = "";

function figure(c) {
  if (c.extra === "steps") return STEPS;
  if (c.extra === "jobs") return jobsHtml();
  const shot = `<div class="frame"><img src="${c.img}" alt="${esc(c.alt)}"></div>`;
  if (c.extra === "handoff") return `<div class="duo">${shot}<div class="handoff">${handoffHtml || ""}</div></div>`;
  return shot;
}
function copy(c) {
  return `<span class="num" style="--tint:${c.tint}">${c.n} · ${esc(c.kicker)}</span>
    <h2>${c.head}</h2>
    <p class="lead">${esc(c.lead)}</p>
    ${c.how ? `<ul class="how">${c.how.map((h) => `<li><i></i><span>${h}</span></li>`).join("")}</ul>` : ""}
    ${c.truth ? `<div class="truth"><b>${esc(c.truth[0])}</b>${esc(c.truth[1])}</div>` : ""}
    <div class="go">${c.cta}</div>`;
}
function paint(i, { animate = true } = {}) {
  at = (i + CAPS.length) % CAPS.length;
  const c = CAPS[at];
  $("panel").style.setProperty("--tint", c.tint);
  $("fig").innerHTML = figure(c);
  $("fig").classList.toggle("whole", Boolean(c.slim || c.extra === "steps" || c.extra === "handoff" || c.extra === "jobs"));
  $("copy").innerHTML = copy(c);
  $("copy").scrollTop = 0;
  if (small.matches) $("auto").hidden = true;
  const tg = $("copy").querySelector("[data-tg]"), dc = $("copy").querySelector("[data-dc]");
  if (tg) tg.href = "https://t.me/" + bot.tg;
  if (dc && bot.dc) { dc.href = bot.dc; dc.hidden = false; }
  tabs.forEach((t, n) => { t.classList.toggle("on", n === at); t.setAttribute("aria-selected", String(n === at)); });
  glide();
  if (animate && !still) { $("panel").classList.remove("swap"); void $("panel").offsetWidth; $("panel").classList.add("swap"); }
  if (view === "stage") history.replaceState(null, "", "#" + c.id);
  sync();
}

/* ── it moves on its own ──
   In the overview a light passes from tile to tile; on the stage the next
   capability comes round. Both rest while you are pointing at the thing, and
   the stage stops for good once you have picked a tab yourself — you are
   reading now, and having the page change under you would be rude. */
const AUTO = 6500, LIGHT = 2600;
const small = matchMedia("(max-width:980px), (max-height:620px)");
// On a phone nothing moves by itself. Every capability is a different height
// there, and a page that re-flows under your thumb while you are reading is
// worse than one that waits to be asked.
let wanted = !still && !small.matches, holds = 0, clock = null, lit = -1;
const resting = () => !wanted || holds > 0 || document.hidden;
function sync() {
  document.documentElement.classList.toggle("resting", view === "stage" && resting());
  clearTimeout(clock); clock = null;
  if (document.hidden || holds > 0) return;
  if (view === "bento") {
    if (still || small.matches) return;
    clock = setTimeout(() => {
      lit = (lit + 1) % tiles.length;
      tiles.forEach((t, n) => t.classList.toggle("lit", n === lit));
      sync();
    }, lit < 0 ? 1400 : LIGHT);
  } else if (wanted) {
    const on = tabs[at]; // restart the bar so the clock on screen matches this one
    on.classList.remove("on"); void on.offsetWidth; on.classList.add("on");
    clock = setTimeout(() => paint(at + 1), AUTO);
  }
}
const hold = () => { holds++; tiles.forEach((t) => t.classList.remove("lit")); sync(); };
const release = () => { holds = Math.max(0, holds - 1); sync(); };
// What counts as "doing something with it": pointing at the tiles, at the
// tabs, or at the words you are reading — not at the picture, and not the
// focus this page sets itself after a click. The board is most of the screen,
// so resting whenever the pointer was anywhere on it meant it never moved.
for (const el of [$("bento"), $("dock"), $("copy")]) {
  el.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") hold(); });
  el.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") release(); });
}
let keyHeld = false;
$("board").addEventListener("focusin", (e) => { if (!keyHeld && e.target.matches(":focus-visible")) { keyHeld = true; hold(); } });
$("board").addEventListener("focusout", (e) => { if (keyHeld && !$("board").contains(e.relatedTarget)) { keyHeld = false; release(); } });
document.addEventListener("visibilitychange", sync);

/* ── between the two views ──
   The tile that was clicked carries the same transition name as the stage's
   panel, so the browser grows one into the other. Where it cannot, the views
   simply change places. */
function change(to, i, from) {
  const swap = () => {
    view = to; holds = keyHeld ? 1 : 0;
    $("bento").hidden = to !== "bento";
    $("stage").hidden = to !== "stage";
    if (to === "stage") paint(i, { animate: false });
    else { history.replaceState(null, "", location.pathname); lit = -1; tiles.forEach((t) => t.classList.remove("lit")); sync(); }
  };
  const tile = tiles[i] ?? tiles[at];
  if (still || !document.startViewTransition || small.matches) {
    swap();
    if (to === "stage") $("panel").classList.add("swap");
    // The page is a scrolling one here, and the tile that was tapped may have
    // been far down it: start the capability from its top, and come back to
    // the tile it was opened from.
    if (small.matches) requestAnimationFrame(() => (to === "stage" ? $("stage") : tile).scrollIntoView({ block: to === "stage" ? "start" : "center", behavior: "auto" }));
    return;
  }
  document.documentElement.classList.add("morph");
  if (to === "stage") tile.style.viewTransitionName = "cap";
  else $("panel").style.viewTransitionName = "cap";
  const t = document.startViewTransition(() => {
    swap();
    if (to === "stage") { tile.style.viewTransitionName = ""; $("panel").style.viewTransitionName = "cap"; }
    else { $("panel").style.viewTransitionName = ""; tile.style.viewTransitionName = "cap"; }
  });
  t.finished.finally(() => {
    document.documentElement.classList.remove("morph");
    tile.style.viewTransitionName = ""; $("panel").style.viewTransitionName = "";
    if (to === "stage") (tabs[at]).focus({ preventScroll: true }); else tile.focus({ preventScroll: true });
  });
}

tiles.forEach((t, i) => t.addEventListener("click", () => change("stage", i)));

/* The screenshot in a tile leans a few pixels away from the pointer, so the
   tile reads as having depth. Only the picture moves; see the note on .tile. */
if (!still) tiles.forEach((t) => {
  const peek = t.querySelector(".peek"); if (!peek) return;
  let raf = 0, x = 0, y = 0;
  t.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const r = t.getBoundingClientRect();
    x = ((e.clientX - r.left) / r.width - .5) * -18; y = ((e.clientY - r.top) / r.height - .5) * -14;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; t.classList.add("tracking"); peek.style.setProperty("--px", x.toFixed(1) + "px"); peek.style.setProperty("--py", y.toFixed(1) + "px"); });
  });
  t.addEventListener("pointerleave", () => { t.classList.remove("tracking"); peek.style.setProperty("--px", "0px"); peek.style.setProperty("--py", "0px"); });
});
tabs.forEach((t, i) => t.addEventListener("click", () => {
  wanted = false; // they have taken over
  if (small.matches) requestAnimationFrame(() => $("stage").scrollIntoView({ block: "start", behavior: still ? "auto" : "smooth" }));
  $("auto").setAttribute("aria-pressed", "false"); $("auto").setAttribute("aria-label", "Play");
  paint(i);
}));
$("overview").addEventListener("click", () => change("bento", at));
$("auto").addEventListener("click", () => {
  wanted = !wanted;
  $("auto").setAttribute("aria-pressed", String(wanted));
  $("auto").setAttribute("aria-label", wanted ? "Pause" : "Play");
  sync();
});
addEventListener("keydown", (e) => {
  if (view !== "stage" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") change("bento", at);
  else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); wanted = false; paint(at + 1); tabs[at].focus({ preventScroll: true }); }
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); wanted = false; paint(at - 1); tabs[at].focus({ preventScroll: true }); }
});

// A link to one capability opens the stage on it.
function openHash() {
  const wanted = location.hash === "#roles" ? "#jobs" : location.hash; // the old name for this one
  const i = CAPS.findIndex((c) => "#" + c.id === wanted);
  if (i < 0) return false;
  view = "stage"; $("bento").hidden = true; $("stage").hidden = false;
  paint(i);
  return true;
}
addEventListener("hashchange", openHash);

/* Bot links come from the server so they stay right when the bot changes. */
fetch("/api/stats").then((r) => r.json()).then((s) => {
  if (s.botUsername) bot.tg = s.botUsername;
  if (s.discordInvite) bot.dc = s.discordInvite;
  if (view === "stage") paint(at, { animate: false });
}).catch(() => {});

/* The recorded handoff: one column per app, in the order it happened, with
   the blob ids of the memories the first message produced. */
const APP = { telegram: ["Telegram", TG], discord: ["Discord", DC],
  web: ["Web", '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="9" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M5 14h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'] };
const short = (id) => id.length > 14 ? id.slice(0, 6) + "…" + id.slice(-4) : id;
fetch("/assets/handoff.json").then((r) => r.json()).then((rec) => {
  const cols = [];
  for (const e of rec.events) {
    if (!e.surface) continue;
    let col = cols.find((c) => c.surface === e.surface);
    if (!col) { col = { surface: e.surface, items: [], blobs: [], at: e.at }; cols.push(col); }
    if (e.type === "user") col.items.push(`<div class="m you">${esc(e.text)}</div>`);
    else if (e.type === "bot") col.items.push(`<div class="m bot">${esc(e.text)}</div>`);
    else if (e.type === "linked") col.items.unshift(`<div class="m sys">linked with code · <code>${esc(rec.events.find((x) => x.type === "code" && x.at < e.at && x.surface !== e.surface)?.code ?? "")}</code></div>`);
    else if (e.type === "write" && e.kind === "analyze" && e.facts?.length) col.blobs.push(e);
  }
  handoffHtml = cols.map((c) => `
    <div class="col">
      <div class="col-h">${APP[c.surface][1]} ${APP[c.surface][0]}<span class="t">+${Math.round(c.at / 1000)}s</span></div>
      <div class="msgs">${c.items.join("")}</div>
      ${c.blobs.length ? `<div class="blobs">${c.blobs.map((b) => `
        <div class="blob"><i></i><em>${esc(b.facts[0])}</em><a href="https://walruscan.com/mainnet/blob/${encodeURIComponent(b.blobId)}" target="_blank" rel="noopener">${esc(short(b.blobId))} ↗</a></div>`).join("")}</div>` : ""}
    </div>`).join("");
  if (view === "stage" && CAPS[at].extra === "handoff") paint(at, { animate: false });
}).catch(() => {});

if (!openHash()) sync();
</script>
</body>
</html>
