<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Continuity">
  <defs>
    <radialGradient id="ct-core" cx="35%" cy="30%" r="74%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="44%" stop-color="#9BD0FF"/>
      <stop offset="100%" stop-color="#2E7ACB"/>
    </radialGradient>
    <linearGradient id="ct-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#5AA9FF"/>
    </linearGradient>
  </defs>

  <!-- The thread that never breaks: a faint full turn, with the two lit arcs
       riding on it. Two arcs rather than one ring because the memory is reached
       from more than one direction. -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#5AA9FF" stroke-width="1.5" opacity=".22"/>
  <path d="M16 5a11 11 0 0 1 11 11" fill="none" stroke="url(#ct-arc)"
    stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16 27A11 11 0 0 1 5 16" fill="none" stroke="url(#ct-arc)"
    stroke-width="2.4" stroke-linecap="round"/>

  <!-- The thing being carried between them. -->
  <circle cx="16" cy="16" r="4.1" fill="url(#ct-core)"/>
</svg>
