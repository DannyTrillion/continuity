<!doctype html>
<meta charset="utf8">
<title>Continuity title card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,300;9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --void:#05070A;
    --ink:#F4F8FC; --body:#8C9AAB; --dim:#5E6977; --faint:#3C4551;
    --live:#5AA9FF; --amber:#F0C068;
    --display:'Fraunces',Georgia,serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}

  .card{
    position:relative; width:1200px; height:675px; overflow:hidden;
    background:var(--void); isolation:isolate;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding-bottom:26px;
  }

  /* One soft light behind the mark, and nothing else competing with it. */
  .glow{position:absolute; z-index:0; left:50%; top:30%; transform:translate(-50%,-50%);
    width:900px; height:620px;
    background:radial-gradient(closest-side,
      rgba(90,169,255,.16), rgba(90,169,255,.055) 44%, transparent 70%);
    filter:blur(14px)}

  /* A vignette, so the frame reads as a lit space rather than a flat fill. */
  .vig{position:absolute; z-index:1; inset:0; pointer-events:none;
    background:radial-gradient(135% 115% at 50% 38%, transparent 42%, rgba(0,0,0,.62) 100%)}

  /* Grain. Without it a near-black gradient bands visibly on most screens,
     and the card looks cheap at exactly the size people will view it. */
  .grain{position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.42;
    mix-blend-mode:overlay}

  .stack{position:relative; z-index:3; text-align:center; padding:0 70px;
    display:flex; flex-direction:column; align-items:center}

  .mark{width:72px; height:72px; margin-bottom:46px; display:block;
    filter:drop-shadow(0 0 30px rgba(90,169,255,.5)) drop-shadow(0 0 8px rgba(155,208,255,.35))}

  h1{font-family:var(--display); font-variation-settings:'SOFT' 0,'WONK' 1;
    font-size:67px; line-height:1.12; letter-spacing:-.03em; max-width:16em}
  h1 .a{display:block; font-weight:200; color:var(--body)}
  h1 .b{display:block; font-weight:400; color:var(--ink); margin-top:2px}

  .sub{margin-top:36px; font-family:var(--display); font-weight:300;
    font-size:19px; line-height:1.6; color:var(--dim); letter-spacing:.004em}
  .sub b{color:#A9B8C8; font-weight:400}

  /* A hairline, the width of the type above it, instead of a box or a button. */
  .rule{width:92px; height:1px; margin-top:38px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent)}

  .foot{position:absolute; z-index:3; bottom:44px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:var(--mono); font-size:11.5px; font-weight:500; letter-spacing:.3em;
    text-transform:uppercase; color:var(--faint)}
  .foot i{width:5px; height:5px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 10px rgba(240,192,104,.8); flex:none}
</style>

<div class="card">
  <div class="glow"></div>

  <div class="stack">
    <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="Continuity">
        <defs>
          <radialGradient id="ct-core" cx="35%" cy="30%" r="74%">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="44%" stop-color="#9BD0FF"/>
            <stop offset="100%" stop-color="#2E7ACB"/>
          </radialGradient>
          <linearGradient id="ct-arc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#5AA9FF"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="11" fill="none" stroke="#5AA9FF" stroke-width="1.5" opacity=".22"/>
        <path d="M16 5a11 11 0 0 1 11 11" fill="none" stroke="url(#ct-arc)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M16 27A11 11 0 0 1 5 16" fill="none" stroke="url(#ct-arc)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="4.1" fill="url(#ct-core)"/>
      </svg>
    <h1>
      <span class="a">Most chatbots forget you.</span>
      <span class="b">This one can't.</span>
    </h1>
    <p class="sub">One memory on <b>Walrus mainnet</b>.<br>Web, Telegram and Discord.</p>
    <div class="rule"></div>
  </div>

  <div class="vig"></div>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)" opacity="0.5"/>
  </svg>

  <div class="foot"><i></i>Continuity · Walrus Sessions 8</div>
</div>
